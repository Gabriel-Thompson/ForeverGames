name: Infrastructure plan
on:
  pull_request:
    paths: ['infra/**', 'config/**', '.github/workflows/**']
permissions: { id-token: write, contents: read, pull-requests: write }
jobs:
  what-if:
    runs-on: ubuntu-latest
    environment: azure-plan
    strategy: { matrix: { environment: [staging, prod] } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
      - name: What-if only (never deploy)
        env: { POSTGRES_ADMIN_PASSWORD: '${{ secrets.POSTGRES_ADMIN_PASSWORD }}' }
        run: az deployment sub what-if --location centralus --template-file infra/main.bicep --parameters infra/parameters/${{ matrix.environment }}.bicepparam --no-pretty-print
