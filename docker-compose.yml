services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forever_games
      POSTGRES_USER: forever_games
      POSTGRES_PASSWORD: forever_games
    ports: ["5432:5432"]
    volumes: ["forever_games_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever_games"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]
volumes:
  forever_games_postgres:

